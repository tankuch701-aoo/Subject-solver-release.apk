name: Publish Debug APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Validate & Publish Debug APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate pre-built APK and checksum
        run: |
          set -euo pipefail
          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is missing or empty."
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ]; then
            echo "ERROR: $SHA_PATH is missing."
            exit 1
          fi

          EXPECTED_SHA=$(awk '{print $1}' "$SHA_PATH" | tr -d '\r\n')
          ACTUAL_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')

          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "ERROR: SHA-256 checksum mismatch!"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          unzip -tq "$APK_PATH"

          APK_BYTES=$(stat -c '%s' "$APK_PATH")
          APK_HUMAN=$(du -h "$APK_PATH" | awk '{print $1}')
          echo "APK_SHA256=$ACTUAL_SHA" >> "$GITHUB_ENV"
          echo "APK_SIZE=${APK_HUMAN} (${APK_BYTES} bytes)" >> "$GITHUB_ENV"

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          gh release create "$RELEASE_TAG" \
            "apk-distribution/app-debug.apk#app-debug.apk" \
            --title "Debug APK Build #${{ github.run_number }}.${{ github.run_attempt }}" \
            --notes "Pre-compiled Android Debug APK ready to install.\n\n- **Size:** ${APK_SIZE}\n- **SHA-256:** \`${APK_SHA256}\`" \
            --latest

          RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"

      - name: Write job summary
        run: |
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          {
            echo "## Debug APK Published"
            echo ""
            echo "- **Release Tag:** \`${RELEASE_TAG}\`"
            echo "- **APK Size:** ${APK_SIZE}"
            echo "- **SHA-256:** \`${APK_SHA256}\`"
            echo "- **GitHub Release Page:** ${RELEASE_URL}"
            echo "- **Direct Latest APK Download:** ${DIRECT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
